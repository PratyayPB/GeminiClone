[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Redirect /api/* to Netlify Functions for cleaner URLs (optional)
[[redirects]]
  from = "/api/gemini"
  to = "/netlify/functions/gemini"
  status = 200

# SPA fallback - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
